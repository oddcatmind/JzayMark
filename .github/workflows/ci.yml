name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  node-18-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Verify ESM and CommonJS runtime
        run: |
          node --input-type=module -e "import('./dist/index.js').then(m => { m.configure({ nodes: { x: { body: 'none' } } }); if (m.print(m.parse('<x>')).trim() !== '<x>') process.exit(1) })"
          node -e "const m = require('./dist/index.cjs'); m.configure({ nodes: { x: { body: 'none' } } }); if (m.print(m.parse('<x>')).trim() !== '<x>') process.exit(1)"
