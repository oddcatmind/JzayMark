name: Publish jzayMark to NPM
run-name: Publish jzaymark@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-jzaymark
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable NPM CLI
        run: npm install --global npm@latest
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); if(p.version!==process.env.EXPECTED_VERSION) throw new Error('package version mismatch')"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
